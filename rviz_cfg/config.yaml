# 配置参数示例
bag_path: /home/xf/Desktop/catkin_ws/data/1028_3.bag
gnss_topic: /chcnav/devpvt
lidar_topic: /lidar_points
gnss_enu: gnss_enu.tum
gnss_enu_original: gnss_enu_original.txt
out_lidar_enu: out_lidar_enu.tum
out_pcd_dir: ./pcd/
gnss_utm: gnss_utm.tum
gnss_utm_original: gnss_utm_original.txt


# Configuration file for Pose3SLAMExample_g2o

# Reference coordinates offset
reference:
  x: 662334.92633696645
  y: 4873532.7935474264
  z: 0.0

# Advanced voxel filter parameters
voxel_filter:
  min_distance: 5.0        # Minimum distance for point cloud filtering (meters)
  max_distance: 80.0        # Maximum distance for point cloud filtering (meters)
  min_z: -2.50              # Minimum Z coordinate (meters)
  max_z: 30.0               # Maximum Z coordinate (meters)
  voxel_size: 0.1           # Voxel grid size for downsampling (meters)

# File paths and working directory
paths:
  work_dir: "/home/xf/Desktop/catkin_ws/data/28_3_enu/new/"

# Optimization parameters
optimization:
  method: "ISAM2"           # Optimization method: "LM" or "ISAM2"
  
  # LevenbergMarquardt parameters
  lm:
    verbosity: "ERROR"      # ERROR/SILENT/TERMINATION/VALUES
    max_iterations: 100
    linear_solver_type: "MULTIFRONTAL_QR"  # QR or MULTIFRONTAL_CHOLESKY
    lambda_initial: 0.1
    lambda_factor: 3.0
    lambda_upper_bound: 1.0e8
    lambda_lower_bound: 1.0e-9
    relative_error_tol: 0.001
    absolute_error_tol: 0.001

# Noise model parameters
noise:
  # Odometry noise model (BetweenFactor)
  odometry:
    rotation_std: 0.002         # Rotation standard deviation (radians)
    translation_std_xy: 0.25     # XY translation standard deviation (meters)
    translation_std_z: 0.5      # Z translation standard deviation (meters)
  
  # GNSS prior noise model
  gnss:
    position_std_xy: 0.1       # GNSS horizontal position std (meters)
    position_std_z: 0.15        # GNSS vertical position std (meters)
    gnss_prior_multiplier: 100  # Multiplier for GNSS prior variance
    gnss_prior_interval: 100    # Add GNSS prior every N frames (0 to disable)

# Loop closure parameters
loop_closure:
  time_thresh: 10.0             # Time threshold for loop detection (seconds)
  spatial_thresh: 15.0          # Spatial distance threshold (meters)
  fitness_thresh: 1.0           # GICP fitness score threshold
  max_fitness_reject: 200.0      # Reject loop if fitness > this value
  voxel_size: 0.1               # Voxel size for loop closure
  max_iter: 50                  # Maximum GICP iterations
  variance_scale: 10.0          # Variance scaling factor
  
  # Loop noise model
  noise:
    var_trans: 0.20            # Translation variance for good loops
    var_rot: 0.002              # Rotation variance for good loops
  
  # Loop search range
  search:
    start_index: 0           # Start index for loop search
    end_index: 2000             # End index for loop search
    step: 10                     # Step size for loop search
    min_key_diff: 20            # Minimum key difference to consider
  
  # Loop file saving/loading
  save_loop_g2o: true           # Save loop closures to g2o file
  load_loop_g2o: false          # Load loop closures from g2o file

# GICP parameters
gicp:
  correspondence_randomness: 128
  max_correspondence_distance: 0.50
  max_iterations: 128
  transformation_epsilon: 0.001
  rotation_epsilon: 0.001
  initial_lambda_factor: 1.0e-9
  regularization_method: "PLANE"  # PLANE or FROBENIUS

# Key frame extraction parameters
keyframe:
  min_distance: 1.0             # Minimum distance between keyframes (meters)
  min_yaw_deg: 5.0              # Minimum yaw change between keyframes (degrees)

# GICP transform validation
gicp_validation:
  max_trans_diff: 2.0           # Maximum translation difference (meters)
  max_rot_diff: 0.5             # Maximum rotation difference (radians)

# LiDAR to GNSS extrinsic calibration (T_gnss_lidar)
# lidar 在 GNSS 坐标系下的 坐标
# Transformation from GNSS frame to LiDAR frame
lidar_gnss_extrinsic:
  quaternion:
    x: 0.0
    y: 0.0
    z: 0.7071068
    w: 0.7071068
  translation:
    x: 0.06
    y: -0.02
    z: 0.25